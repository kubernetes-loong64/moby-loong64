name: loong64
on:
  push:
    branches:
      - loong64-*
    tags:
      - release-loong64-*
  pull_request:
    branches:
      - loong64-*

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    outputs:
      RAW_VERSION: ${{ steps.extract.outputs.RAW_VERSION }}
      MOBY_BRANCH: ${{ steps.extract.outputs.MOBY_BRANCH }}
      RELEASE: ${{ steps.extract.outputs.RELEASE }}
      IS_STABLE: ${{ steps.extract.outputs.IS_STABLE }}
      VERSION: ${{ steps.extract.outputs.VERSION }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi
      - name: Extract moby branch
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          echo "REF=$REF"
          RAW_VERSION=$(echo $REF | awk -F'loong64-' '{print $2}')
          echo "RAW_VERSION=$RAW_VERSION"
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_ENV}
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_OUTPUT}
          MOBY_BRANCH=$(echo $RAW_VERSION | awk -F'+' '{print $1}')
          echo "MOBY_BRANCH=$MOBY_BRANCH"
          echo "MOBY_BRANCH=$MOBY_BRANCH" >> ${GITHUB_ENV}
          echo "MOBY_BRANCH=$MOBY_BRANCH" >> ${GITHUB_OUTPUT}
          VERSION=$(echo $MOBY_BRANCH | awk -F'v' '{print $2}')
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> ${GITHUB_ENV}
          echo "VERSION=$VERSION" >> ${GITHUB_OUTPUT}
          RELEASE=$(echo $RAW_VERSION | awk -F'+' '{print $2}')
          RELEASE=${RELEASE:-alpha.${{ github.run_number }}}
          echo "RELEASE=$RELEASE"
          echo "RELEASE=$RELEASE" >> ${GITHUB_ENV}
          echo "RELEASE=$RELEASE" >> ${GITHUB_OUTPUT}
          if echo "$RAW_VERSION" | grep -qE '[+].*(alpha|beta|rc)'; then
            IS_STABLE=false
          else
            IS_STABLE=true
          fi
          echo "IS_STABLE=$IS_STABLE"
          echo "IS_STABLE=$IS_STABLE" >> ${GITHUB_OUTPUT}
      - name: Install build tools
        run: |
          apt update
          apt install -y git make golang file
      - name: Clone moby
        run: |
          git clone --branch ${{ env.MOBY_BRANCH }} --depth 1 https://github.com/moby/moby.git moby
      - name: ls
        run: ls -lah
      - name: Install Docker CLI
        run: |
          apt remove $(dpkg --get-selections docker.io docker-compose docker-doc podman-docker containerd runc | cut -f1)
          apt update
          apt install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          # Add the repository to Apt sources:
          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt update
          apt install -y docker-ce-cli
      - name: Verify Docker installation
        run: |
          ls -la /run/docker.sock 2>/dev/null || echo "/run/docker.sock not found"
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker info
      #- name: Apply patches
      #  working-directory: moby
      #  run: git apply ../*.patch
      - name: Build moby
        working-directory: moby
        env:
          GOOS: linux
          GOARCH: loong64
        run: |
          echo "VERSION=$VERSION"
          GITCOMMIT=$(git rev-parse HEAD)
          echo "GITCOMMIT=$GITCOMMIT"
          BUILDTIME=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" --rfc-3339 ns 2>/dev/null | sed -e 's/ /T/')
          echo "BUILDTIME=$BUILDTIME"
          LDFLAGS="-X github.com/moby/moby/v2/dockerversion.Version=${VERSION}"
          echo "LDFLAGS=$LDFLAGS"
          LDFLAGS="${LDFLAGS} -X github.com/moby/moby/v2/dockerversion.GitCommit=${GITCOMMIT}"
          echo "LDFLAGS=$LDFLAGS"
          LDFLAGS="${LDFLAGS} -X github.com/moby/moby/v2/dockerversion.BuildTime=${BUILDTIME}"
          echo "LDFLAGS=$LDFLAGS"
          mkdir -p bundles/binary
          go build -ldflags "${LDFLAGS}" -o bundles/binary/dockerd ./cmd/dockerd
          go build -ldflags "${LDFLAGS}" -o bundles/binary/docker-proxy ./cmd/docker-proxy
      - name: Print binary SHA-256 checksums
        working-directory: moby
        run: |
          find ./bundles -type f | xargs sha256sum
      - name: Inspect binary file types
        working-directory: moby
        run: |
          echo "=== bin ==="
          file bundles/**/**
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moby-loong64-binaries
          path: |
            moby/bundles/*
      - name: Install QEMU binfmt for loong64
        run: |
          docker run --privileged --rm ghcr.io/loong64/binfmt --install all
      - name: Print docker version
        working-directory: moby
        run: |
          ./bundles/binary/dockerd -v
          ./bundles/binary/docker-proxy -v
      - name: Generate shell completions
        working-directory: moby
        run: |
          mkdir -p completions
          ./bundles/binary/dockerd completion bash > completions/dockerd.bash
          ./bundles/binary/dockerd completion fish > completions/dockerd.fish
          ./bundles/binary/dockerd completion zsh  > completions/_dockerd.zsh
          echo "=== dockerd.bash ==="
          cat completions/dockerd.bash
          echo "=== dockerd.fish ==="
          cat completions/dockerd.fish
          echo "=== _dockerd.zsh ==="
          cat completions/_dockerd.zsh
      - name: Upload shell completions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moby-loong64-completions
          path: |
            moby/completions/*
      - name: Generate man pages
        working-directory: moby
        run: |
          apt install -y help2man
          mkdir -p man
          help2man -n "Docker Engine (loong64)" -N -o man/dockerd.1 ./bundles/binary/dockerd
          echo "=== dockerd.1 ==="
          man man/dockerd.1 2>/dev/null | head -30 || cat man/dockerd.1 | head -30
          echo "=== man file list ==="
          find man -type f
          sha256sum man/dockerd.1
      - name: Upload man pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moby-loong64-man
          path: |
            moby/man/*

  rpm-anolis:
    needs: build
    runs-on: ubuntu-latest
    container: openanolis/anolisos:23
    outputs:
      ANOLIS_RPM_NAME: ${{ steps.rpm-file.outputs.ANOLIS_RPM_NAME }}
      ANOLIS_VERSION: ${{ steps.extract-version.outputs.ANOLIS_VERSION }}
    permissions:
      contents: read
    env:
      RAW_VERSION: ${{ needs.build.outputs.RAW_VERSION }}
      MOBY_BRANCH: ${{ needs.build.outputs.MOBY_BRANCH }}
      RELEASE: ${{ needs.build.outputs.RELEASE }}
      ARCH: loongarch64
      VERSION: ${{ needs.build.outputs.VERSION }}
    steps:
      - name: Install gzip
        run: yum install -y gzip
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Extract version
        id: extract-version
        run: |
          DIST=$(rpm --eval '%{dist}')
          echo "DIST=$DIST"
          echo "DIST=$DIST" >> ${GITHUB_ENV}
          ANOLIS_VERSION=$(cat /etc/anolis-release | awk '{print $4}' | cut -d'.' -f1)
          echo "ANOLIS_VERSION=$ANOLIS_VERSION"
          echo "ANOLIS_VERSION=$ANOLIS_VERSION" >> ${GITHUB_OUTPUT}
          echo "ANOLIS_VERSION=$ANOLIS_VERSION" >> ${GITHUB_ENV}
      - name: Install build tools
        run: yum install -y rpm-build rpmdevtools rpm-sign
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-binaries
          path: artifacts
      - name: Download shell completions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-completions
          path: artifacts/completions
      - name: Download man pages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-man
          path: artifacts/man
      - name: Build RPM
        run: |
          rm -rf ~/rpmbuild
          rpmdev-setuptree
          find ~/rpmbuild
          cp artifacts/binary/dockerd ~/rpmbuild/BUILD/
          cp artifacts/binary/docker-proxy ~/rpmbuild/BUILD/
          cp -r artifacts/completions ~/rpmbuild/BUILD/
          cp -r artifacts/man ~/rpmbuild/BUILD/
          cp -r systemd ~/rpmbuild/BUILD/
          cp LICENSE ~/rpmbuild/BUILD/
          cp docker-ce.spec ~/rpmbuild/SPECS/
          rpmbuild -ba --target ${{ env.ARCH }} ~/rpmbuild/SPECS/docker-ce.spec \
            --define "version ${{ env.VERSION }}" \
            --define "release ${{ env.RELEASE }}"
          mkdir -p rpms
          find ~/rpmbuild/RPMS -name '*.rpm'
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp -t rpms {} +
      - name: List RPM files
        id: rpm-file
        run: |
          ANOLIS_RPM_NAME=docker-ce-${{ env.VERSION }}-${{ env.RELEASE }}${{ env.DIST }}.${{ env.ARCH }}.rpm
          echo "ANOLIS_RPM_NAME=$ANOLIS_RPM_NAME"
          echo "ANOLIS_RPM_NAME=$ANOLIS_RPM_NAME" >> $GITHUB_OUTPUT
          echo "ANOLIS_RPM_NAME=$ANOLIS_RPM_NAME" >> $GITHUB_ENV
          echo "=== RPM file name: $ANOLIS_RPM_NAME ==="
          sha256sum rpms/$ANOLIS_RPM_NAME
          echo "=== RPM info ==="
          rpm -qpi rpms/$ANOLIS_RPM_NAME
          echo "=== RPM contents ==="
          rpm2cpio rpms/$ANOLIS_RPM_NAME | cpio -it
      - name: Import GPG key
        run: |
          export LANG=C.UTF-8
          echo "${{ secrets.GPG_PRIVATE_KEY_BASE64 }}" | base64 -d | gpg --batch --import > /dev/null
          echo "$(gpg --list-secret-keys --keyid-format LONG | grep -Eo '[A-F0-9]{40}' | head -1):6:" | gpg --import-ownertrust
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec:' | head -1 | cut -d: -f5)
          echo "GPG_KEY_ID=$GPG_KEY_ID"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
      - name: Configure rpmmacros
        run: |
          cat > ~/.rpmmacros << EOF
          %_signature gpg
          %_gpg_path ~/.gnupg
          %_gpg_name ${{ env.GPG_KEY_ID }}
          %_gpgbin /usr/bin/gpg2
          %__gpg_sign_cmd %{__gpg} gpg --force-v3-sigs --digest-algo sha256 --batch --no-verbose --no-armor --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          gpg --armor --export "${GPG_KEY_ID}" > /tmp/gpg-pubkey.asc
          rpm --import /tmp/gpg-pubkey.asc
      - name: Sign RPM
        run: |
          echo "=== Signing RPM with GPG key: $GPG_KEY_ID ==="
          rpm --addsign rpms/$ANOLIS_RPM_NAME
          echo "=== Verifying RPM signature ==="
          rpm --checksig rpms/$ANOLIS_RPM_NAME
          echo "=== RPM file name: $ANOLIS_RPM_NAME ==="
          sha256sum rpms/$ANOLIS_RPM_NAME
          echo "=== RPM info ==="
          rpm -qpi rpms/$ANOLIS_RPM_NAME
          echo "=== RPM contents ==="
          rpm2cpio rpms/$ANOLIS_RPM_NAME | cpio -it
      - name: Upload RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moby-loong64-rpm
          path: |
            rpms/${{ env.ANOLIS_RPM_NAME }}
      - name: Export system version
        run: |
          cat /etc/os-release > /tmp/rpm-anolis-os-release.txt
          cat /tmp/rpm-anolis-os-release.txt
      - name: Export installed packages
        run: |
          rpm -qa --queryformat '%{NAME}\t%{VERSION}\t%{RELEASE}\t%{ARCH}\n' | column -t -s $'\t' | sort -f > /tmp/rpm-anolis-installed-packages-rpm.txt
          cat /tmp/rpm-anolis-installed-packages-rpm.txt
      - name: Upload system info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moby-loong64-rpm-system-info
          path: |
            /tmp/rpm-anolis-installed-packages-rpm.txt
            /tmp/rpm-anolis-os-release.txt

  deb-debian:
    needs: build
    runs-on: ubuntu-latest
    container: debian:13
    outputs:
      DEBIAN_DEB_NAME: ${{ steps.deb-file.outputs.DEBIAN_DEB_NAME }}
      DEBIAN_VERSION_CODENAME: ${{ steps.extract-version.outputs.DEBIAN_VERSION_CODENAME }}
    permissions:
      contents: read
    env:
      RAW_VERSION: ${{ needs.build.outputs.RAW_VERSION }}
      MOBY_BRANCH: ${{ needs.build.outputs.MOBY_BRANCH }}
      RELEASE: ${{ needs.build.outputs.RELEASE }}
      ARCH: loong64
      VERSION: ${{ needs.build.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build tools
        run: |
          apt update
          apt install -y file
      - name: Extract version
        id: extract-version
        run: |
          ID_VERSION_ID=$(sh -c '. /etc/os-release && echo "${ID}.${VERSION_ID}"')
          echo "ID_VERSION_ID=$ID_VERSION_ID"
          echo "ID_VERSION_ID=$ID_VERSION_ID" >> ${GITHUB_ENV}
          DEBIAN_VERSION_CODENAME=$(sh -c '. /etc/os-release && echo "${VERSION_CODENAME}"')
          echo "DEBIAN_VERSION_CODENAME=$DEBIAN_VERSION_CODENAME"
          echo "DEBIAN_VERSION_CODENAME=$DEBIAN_VERSION_CODENAME" >> ${GITHUB_OUTPUT}
          echo "DEBIAN_VERSION_CODENAME=$DEBIAN_VERSION_CODENAME" >> ${GITHUB_ENV}
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-binaries
          path: artifacts
      - name: Download shell completions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-completions
          path: artifacts/completions
      - name: Download man pages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-man
          path: artifacts/man
      - name: Build DEB
        run: |
          PKG_ROOT=$(mktemp -d)
          mkdir -p $PKG_ROOT/usr/bin
          mkdir -p $PKG_ROOT/usr/share/man/man1
          mkdir -p $PKG_ROOT/usr/share/bash-completion/completions
          mkdir -p $PKG_ROOT/usr/share/fish/vendor_completions.d
          mkdir -p $PKG_ROOT/usr/share/zsh/site-functions
          mkdir -p $PKG_ROOT/usr/share/doc/docker-ce
          mkdir -p $PKG_ROOT/usr/lib/systemd/system
          mkdir -p $PKG_ROOT/DEBIAN

          install -m 755 artifacts/binary/dockerd $PKG_ROOT/usr/bin/dockerd
          install -m 755 artifacts/binary/docker-proxy $PKG_ROOT/usr/bin/docker-proxy
          install -m 644 artifacts/completions/dockerd.bash $PKG_ROOT/usr/share/bash-completion/completions/dockerd
          install -m 644 artifacts/completions/dockerd.fish $PKG_ROOT/usr/share/fish/vendor_completions.d/dockerd.fish
          install -m 644 artifacts/completions/_dockerd.zsh $PKG_ROOT/usr/share/zsh/site-functions/_dockerd
          install -m 644 artifacts/man/dockerd.1 $PKG_ROOT/usr/share/man/man1/dockerd.1
          install -m 644 LICENSE $PKG_ROOT/usr/share/doc/docker-ce/copyright
          install -m 644 systemd/docker.service $PKG_ROOT/usr/lib/systemd/system/docker.service

          cat > $PKG_ROOT/DEBIAN/control << EOF
          Package: docker-ce
          Version: ${{ env.VERSION }}-${{ env.RELEASE }}~${{ env.ID_VERSION_ID }}~${{ env.DEBIAN_VERSION_CODENAME }}
          Architecture: ${{ env.ARCH }}
          Maintainer: 徐晓伟 <xuxiaowei@xuxiaowei.com.cn>
          Description: Docker Engine (loong64)
           Docker Engine (dockerd and docker-proxy) binaries for the loong64 (LoongArch) architecture.
          Homepage: https://github.com/kubernetes-loong64/moby-loong64
          Section: admin
          Priority: optional
          EOF

          cat > $PKG_ROOT/DEBIAN/postinst << 'SCRIPTEOF'
          #!/bin/sh
          set -e
          if [ -d /run/systemd/system ]; then
            systemctl daemon-reload 2>/dev/null || true
            deb-systemd-invoke enable docker.service >/dev/null 2>&1 || true
            deb-systemd-invoke start docker.service >/dev/null 2>&1 || true
          fi
          SCRIPTEOF
          chmod 755 $PKG_ROOT/DEBIAN/postinst

          cat > $PKG_ROOT/DEBIAN/prerm << 'SCRIPTEOF'
          #!/bin/sh
          set -e
          if [ -d /run/systemd/system ]; then
            deb-systemd-invoke stop docker.service >/dev/null 2>&1 || true
          fi
          SCRIPTEOF
          chmod 755 $PKG_ROOT/DEBIAN/prerm

          cat > $PKG_ROOT/DEBIAN/postrm << 'SCRIPTEOF'
          #!/bin/sh
          set -e
          if [ "$1" = "remove" ] && [ -d /run/systemd/system ]; then
            systemctl daemon-reload 2>/dev/null || true
            systemctl reset-failed docker.service 2>/dev/null || true
          fi
          SCRIPTEOF
          chmod 755 $PKG_ROOT/DEBIAN/postrm

          mkdir -p debs
          dpkg-deb --build $PKG_ROOT debs/

          find debs -name '*.deb'
          # Rename: replace ~ with . in filename (GitHub releases / URLs don't like ~)
          for f in debs/*.deb; do
            new_name=$(echo "$f" | tr '~' '.')
            if [ "$f" != "$new_name" ]; then
              mv "$f" "$new_name"
              echo "Renamed: $f -> $new_name"
            fi
          done
      - name: List DEB files
        id: deb-file
        run: |
          DEBIAN_DEB_NAME=docker-ce_${{ env.VERSION }}-${{ env.RELEASE }}.${{ env.ID_VERSION_ID }}.${{ env.DEBIAN_VERSION_CODENAME }}_${{ env.ARCH }}.deb
          echo "DEBIAN_DEB_NAME=$DEBIAN_DEB_NAME"
          echo "DEBIAN_DEB_NAME=$DEBIAN_DEB_NAME" >> $GITHUB_OUTPUT
          echo "DEBIAN_DEB_NAME=$DEBIAN_DEB_NAME" >> $GITHUB_ENV
          echo "=== DEB file name: $DEBIAN_DEB_NAME ==="
          sha256sum debs/$DEBIAN_DEB_NAME
          echo "=== DEB info ==="
          dpkg --info debs/$DEBIAN_DEB_NAME
          echo "=== DEB contents ==="
          dpkg --contents debs/$DEBIAN_DEB_NAME
      - name: Upload DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moby-loong64-deb
          path: |
            debs/${{ env.DEBIAN_DEB_NAME }}
      - name: Export system version
        run: |
          cat /etc/os-release > /tmp/deb-debian-os-release.txt
          cat /tmp/deb-debian-os-release.txt
      - name: Export installed packages
        run: |
          dpkg -l > /tmp/deb-debian-installed-packages-packages.txt
          cat /tmp/deb-debian-installed-packages-packages.txt
      - name: Upload system info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moby-loong64-deb-system-info
          path: |
            /tmp/deb-debian-installed-packages-packages.txt
            /tmp/deb-debian-os-release.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ build, rpm-anolis, deb-debian ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      ANOLIS_RPM_NAME: ${{ needs.rpm-anolis.outputs.ANOLIS_RPM_NAME }}
      DEBIAN_DEB_NAME: ${{ needs.deb-debian.outputs.DEBIAN_DEB_NAME }}
      IS_STABLE: ${{ needs.build.outputs.IS_STABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy systemd service file
        run: |
          mkdir -p loong64-artifacts
          cp systemd/docker.service loong64-artifacts/docker.service
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-binaries
          path: loong64-artifacts
      - name: Download RPM system info
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-rpm-system-info
          path: loong64-artifacts
      - name: Download DEB system info
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-deb-system-info
          path: loong64-artifacts
      - name: Download RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-rpm
          path: loong64-artifacts
      - name: Download DEB
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moby-loong64-deb
          path: loong64-artifacts
      - name: List release artifacts
        run: |
          find loong64-artifacts -type f
      - name: Import GPG key
        run: |
          export LANG=C.UTF-8
          echo "${{ secrets.GPG_PRIVATE_KEY_BASE64 }}" | base64 -d | gpg --batch --import > /dev/null
          echo "$(gpg --list-secret-keys --keyid-format LONG | grep -Eo '[A-F0-9]{40}' | head -1):6:" | gpg --import-ownertrust
      - name: Sign artifacts
        run: |
          find loong64-artifacts -type f | while read -r file; do
            gpg --batch --detach-sign --armor "$file"
            echo "Signed: $file"
            gpg --verify "$file".asc "$file"
          done
      - name: Generate release body
        run: |
          cat > release-body.md <<'BODYEOF'
          ## Artifacts

          | File                         | Download                                                                     |
          |------------------------------|------------------------------------------------------------------------------|
          | `dockerd`                    | [dockerd](${{ env.BASE_URL }}/dockerd)                                       |
          | `docker-proxy`               | [docker-proxy](${{ env.BASE_URL }}/docker-proxy)                             |
          | `docker.service`            | [docker.service](${{ env.BASE_URL }}/docker.service)                         |
          | `${{ env.ANOLIS_RPM_NAME }}` | [${{ env.ANOLIS_RPM_NAME }}](${{ env.BASE_URL }}/${{ env.ANOLIS_RPM_NAME }}) |
          | `${{ env.DEBIAN_DEB_NAME }}` | [${{ env.DEBIAN_DEB_NAME }}](${{ env.BASE_URL }}/${{ env.DEBIAN_DEB_NAME }}) |

          Each file has a corresponding `.asc` detached GPG signature.

          ```shell
          # Binaries
          curl -LO ${{ env.BASE_URL }}/dockerd
          curl -LO ${{ env.BASE_URL }}/dockerd.asc
          curl -LO ${{ env.BASE_URL }}/docker-proxy
          curl -LO ${{ env.BASE_URL }}/docker-proxy.asc

          # systemd service
          curl -LO ${{ env.BASE_URL }}/docker.service
          curl -LO ${{ env.BASE_URL }}/docker.service.asc

          # RPM (Anolis)
          curl -LO ${{ env.BASE_URL }}/${{ env.ANOLIS_RPM_NAME }}
          curl -LO ${{ env.BASE_URL }}/${{ env.ANOLIS_RPM_NAME }}.asc

          # DEB (Debian)
          curl -LO ${{ env.BASE_URL }}/${{ env.DEBIAN_DEB_NAME }}
          curl -LO ${{ env.BASE_URL }}/${{ env.DEBIAN_DEB_NAME }}.asc
          ```

          ## Verifying releases

          ```shell
          gpg --keyserver keys.openpgp.org --recv-keys FCF8724722CCBF9F51B1FBE376532BE7E3013105
          echo "FCF8724722CCBF9F51B1FBE376532BE7E3013105:6:" | gpg --import-ownertrust
          gpg --verify <file>.asc <file>
          ```

          ## Installing systemd service

          ```shell
          sudo cp docker.service /etc/systemd/system/docker.service
          sudo systemctl daemon-reload
          sudo systemctl enable docker.service
          sudo systemctl start docker.service
          ```
